<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26A17B"/>
      <stop offset="100%" stop-color="#159A75"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="96" fill="#0B1220"/>

  <!-- Coin -->
  <circle cx="256" cy="256" r="190" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="174"
          fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.35"/>

  <!-- Generic stablecoin T emblem -->
  <path
    d="M160 145
       H352
       V190
       H285
       V335
       H227
       V190
       H160 Z"
    fill="#FFFFFF"/>

  <!-- Token name -->
  <text x="256" y="390"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="2"
        fill="#FFFFFF">USDT.I</text>

  <!-- TRC20 label -->
  <text x="256" y="430"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="3"
        fill="#D7FFF0">TRC20</text>
</svg>
